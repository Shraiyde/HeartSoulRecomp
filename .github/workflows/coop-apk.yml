name: Co-op APK

# Compiles the native port, including the libzt archive. Branch pushes are
# compile checks and do not upload an APK. The recomp-phone-2 tag publishes
# the debug APK. The lobby URL is the default baked into the build.

on:
  push:
    branches:
      - port
      - cursor/native-coop-cf76
      - coop/direct-phone-host
    tags:
      - recomp-coop-1
      - recomp-phone-1
      - recomp-phone-2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coop-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Two compile jobs. More than that, beside Gradle's 4g heap, gets the
      # runner killed during the arm data build and the log just stops.
      HNS_MAKE_JOBS: 2
      HNS_GRADLE_WORKERS: 2
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      GRADLE_OPTS: -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          set -euo pipefail
          # setup-android@v3 still installs the removed "tools" package and
          # fails in a few seconds. Install the command-line tools directly.
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/cmdtools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdtools.zip" -d "$RUNNER_TEMP/cmdtools"
          rm -rf "$SDK/cmdline-tools/latest"
          mv "$RUNNER_TEMP/cmdtools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Build embedded ZeroTier
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/zerotier/libzt "$RUNNER_TEMP/libzt"
          chmod +x port/build-libzt-android.sh
          LIBZT_SRC="$RUNNER_TEMP/libzt" \
          LIBZT_WORK="$RUNNER_TEMP/libzt-work" \
          NDK_VERSION=29.0.14206865 CMAKE_VERSION=3.22.1 \
            port/build-libzt-android.sh

      - name: Build image
        run: docker build -t hns-port port/docker

      - name: Assemble debug APK
        env:
          HNS_LOBBY_URL: ${{ vars.HNS_LOBBY_URL }}
          HNS_LOBBY_KEY: ${{ secrets.HNS_LOBBY_KEY }}
        run: |
          set -euo pipefail
          chmod +x port/*.sh android/gradlew
          # The data build runs in Docker, where this checkout looks ownerless
          # to git. The history check then aborts before any compile.
          touch .histignore
          # Maven Central answers 429 when many runners resolve the Android
          # plugin at once. The native objects stay on disk, so a retry only
          # repeats the Gradle download. Other failures are not retried.
          ok=0
          for attempt in 1 2 3 4 5; do
            set +e
            port/build-apk.sh 2>&1 | tee "$RUNNER_TEMP/assemble.log"
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" = 0 ]; then
              ok=1
              break
            fi
            if ! grep -q '429' "$RUNNER_TEMP/assemble.log"; then
              echo "assemble failed for a reason other than rate limiting"
              exit "$code"
            fi
            echo "assemble attempt ${attempt} was rate limited; waiting before retry"
            sleep $((attempt * 20))
          done
          test "$ok" = 1
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          if [ "${GITHUB_REF}" = "refs/tags/recomp-phone-2" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk \
              "$RUNNER_TEMP/HeartSoulRecomp-recomp-phone-2.apk"
            ls -lh "$RUNNER_TEMP/HeartSoulRecomp-recomp-phone-2.apk"
          else
            echo "debug APK compiled; not uploaded"
          fi

      - name: Publish phone co-op release
        if: github.ref == 'refs/tags/recomp-phone-2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: recomp-phone-2
          name: Heart & Soul phone co-op 2
          files: ${{ runner.temp }}/HeartSoulRecomp-recomp-phone-2.apk
          body: |
            Phone-to-phone Heart & Soul co-op. HOST A GAME and JOIN A GAME use
            embedded ZeroTier. Hosts are listed at the Heart & Soul lobby directory.
            JOIN PC HOST still joins the Windows World Host.
            On-screen L, R, the D-pad, A, B, Select and Start sit below the
            picture and set those GBA keys while held.
            This APK is the CI debug build.
          draft: false
          prerelease: false
          make_latest: false
